upgrade_path_rules:
  - "Upgrade one minor version at a time by following each node's next value."
  - "If the requested target is newer than the graph, stop and consult maintainers/add-new-rails-version.md."
  - "Upgrade Ruby before Rails when the next hop's target_ruby_min exceeds the app's current Ruby."
  - "Target the latest patch release inside each minor line; do not jump to an unrequested newer minor."

optional_modernizations:
  rails_8:
    - "Sprockets to Propshaft"
    - "Redis-backed jobs to Solid Queue"
    - "Redis-backed cache to Solid Cache"
    - "Redis-backed Action Cable to Solid Cable"
    - "Existing authentication to the Rails authentication generator"
    - "Existing deployment tooling to Kamal or Thruster"
